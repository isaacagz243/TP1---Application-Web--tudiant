<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inscrivez-vous à une activité étudiante sur Campus Hub.">
    <title>Inscription – Campus Hub</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <div class="header">
        <h1>Bienvenue sur le site du Campus Hub</h1>
        <div class="card">
            <img src="images/CampusHub.jpeg" alt="logo campus">
            </di>
            <br>
            <label><center>Recherche
                <input type="text" placeholder="CampusHub"> </center>
            </label>
        </div>


    <nav class="navbar">
        <a href="index.html">Accueil</a>
        <a href="activites.html">Activites</a>
        <a href="inscription.html" class="active">Inscription</a>
        <a href="gestion.html">Gestion</a>
    </nav>

    <main class="main" id="catalogue">
        <h2>Inscription</h2>
        <p>Remplissez le formulaire pour réserver votre place.</p>

        <p class="msg cache" id="msg"></p>

        <section id="inscription">
            <form>
                <fieldset>
                    <legend>Vos informations</legend>

                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom">
                    <p class="erreur" id="err-prenom"></p>

                    <label for="nom">Nom</label>
                    <input type="text" id="nom">
                    <p class="erreur" id="err-nom"></p>

                    <label for="courriel">Courriel</label>
                    <input type="email" id="courriel" placeholder="exemple@uqtr.ca">
                    <p class="erreur" id="err-courriel"></p>

                    <label for="programme">Programme</label>
                    <select id="programme">
                        <option value="">-- Choisir --</option>
                        <option>Informatique</option>
                        <option>Génie</option>
                        <option>Sciences de la santé</option>
                        <option>Éducation</option>
                        <option>Administration</option>
                        <option>Arts et lettres</option>
                        <option>Autre</option>
                    </select>
                    <p class="erreur" id="err-programme"></p>

                    <p class="question">Niveau</p>
                    <input type="radio" name="niveau" id="niv1" value="Certificat">
                    <label class="choix" for="niv1">Certificat</label>
                    <input type="radio" name="niveau" id="niv2" value="Baccalauréat">
                    <label class="choix" for="niv2">Baccalauréat</label>
                    <input type="radio" name="niveau" id="niv3" value="Maîtrise">
                    <label class="choix" for="niv3">Maîtrise</label>
                    <p class="erreur" id="err-niveau"></p>
                </fieldset>

                <fieldset>
                    <legend>Activité</legend>

                    <label for="activite">Activité choisie</label>
                    <select id="activite"></select>
                    <p class="erreur" id="err-activite"></p>

                    <label for="commentaire">Commentaire (optionnel)</label>
                    <textarea id="commentaire" rows="4"></textarea>
                    <p class="erreur" id="err-commentaire"></p>

                    <input type="checkbox" id="conditions">
                    <label class="choix" for="conditions">J'accepte les conditions</label>
                    <p class="erreur" id="err-conditions"></p>
                </fieldset>

                <button type="button" class="btn primaire" id="btnInscrire">S'inscrire</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <h3>Campus Hub</h3>
        <p>Téléphone : 819 436-2661</p>
    </footer>

    <script src="js/donnees.js"></script>
    <script src="js/inscription.js"></script>
</body>
</html>
