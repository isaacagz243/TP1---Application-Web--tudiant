<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ajouter, modifier et supprimer les activités publiées sur Campus Hub.">
    <title>Gestion des activités – Campus Hub</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <div class="header">
        <h1>Bienvenue sur le site du Campus Hub</h1>
        <div class="card">
            <img src="images/CampusHub.jpeg" alt="logo campus">
            </di>
            <br>
            <label><center>Recherche
                <input type="text" placeholder="CampusHub"> </center>
            </label>
        </div>


    <nav class="navbar">
        <a href="index.html">Accueil</a>
        <a href="activites.html">Activites</a>
        <a href="inscription.html">Inscription</a>
        <a href="gestion.html" class="active">Gestion</a>
    </nav>

    <main class="main" id="catalogue">
        <h2>Gestion des activités</h2>
        <p>Ajoutez, modifiez ou supprimez une activité.</p>

        <p class="msg cache" id="msg"></p>

        <section id="inscription">
            <form>
                <fieldset>
                    <legend id="titreForm">Ajouter une activité</legend>

                    <label for="titre">Titre</label>
                    <input type="text" id="titre">
                    <p class="erreur" id="err-titre"></p>

                    <label for="categorie">Catégorie</label>
                    <select id="categorie">
                        <option value="">-- Choisir --</option>
                        <option>Conférence</option>
                        <option>Atelier</option>
                        <option>Sport</option>
                        <option>Culture</option>
                        <option>Étude</option>
                        <option>Événement</option>
                        <option>Association</option>
                    </select>
                    <p class="erreur" id="err-categorie"></p>

                    <label for="date">Date</label>
                    <input type="date" id="date">
                    <p class="erreur" id="err-date"></p>

                    <label for="heure">Heure</label>
                    <input type="time" id="heure">
                    <p class="erreur" id="err-heure"></p>

                    <label for="lieu">Lieu</label>
                    <input type="text" id="lieu">
                    <p class="erreur" id="err-lieu"></p>

                    <label for="places">Nombre de places</label>
                    <input type="number" id="places" min="0">
                    <p class="erreur" id="err-places"></p>

                    <label for="image">Image (optionnel)</label>
                    <input type="text" id="image" placeholder="images/photo.jpg">

                    <label for="resume">Courte description</label>
                    <input type="text" id="resume">
                    <p class="erreur" id="err-resume"></p>

                    <label for="description">Description complète</label>
                    <textarea id="description" rows="5"></textarea>
                    <p class="erreur" id="err-description"></p>
                </fieldset>

                <button type="button" class="btn primaire" id="btnAjouter">Ajouter</button>
                <button type="button" class="btn cache" id="btnAnnuler">Annuler</button>
            </form>
        </section>

        <section id="resume-liste">
            <h3>Liste des activités</h3>
            <table id="tableau">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th class="mobile-cache">Catégorie</th>
                        <th class="mobile-cache">Date</th>
                        <th>Places</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="lignes"></tbody>
            </table>
            <p class="cache" id="vide">Aucune activité pour le moment.</p>
        </section>
    </main>

    <footer class="footer">
        <h3>Campus Hub</h3>
        <p>Téléphone : 819 436-2661</p>
    </footer>

    <script src="js/donnees.js"></script>
    <script src="js/gestion.js"></script>
</body>
</html>
